services:
  app:
    image: ghcr.io/jwill89/devbox:php8.5
    command: sleep infinity
    volumes:
      # The folder above this project (~/code), so the project appears at
      # /workspaces/<project-name>. Don't mount the devbox cache volumes here:
      # the image already mounts them (the names below make them shared).
      - ../..:/workspaces:cached
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: app
      DATABASE_URL: mysql://app:app@db:3306/app
    depends_on: [db]

  db:
    # MySQL's LTS line. "latest" is the short-lived innovation line.
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
  # Without a fixed name Compose would make per-project copies of these caches.
  devbox-cache:
    name: devbox-cache
  devbox-pnpm:
    name: devbox-pnpm
